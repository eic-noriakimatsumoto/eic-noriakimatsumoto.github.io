<body>
  
  
  <h3>位置情報</h3>
<div id="result">取得待ち...</div>

<button onclick="getLocation()">位置情報取得</button>

<script>
function getLocation() {

  const result = document.getElementById("result");

  if (!("geolocation" in navigator)) {
    result.textContent = "Geolocation API がサポートされていません";
    return;
  }

  result.textContent = "取得中...";

  navigator.geolocation.getCurrentPosition(
    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      result.innerHTML =
        "緯度: " + lat + "<br>" +
        "経度: " + lng + "<br>" +
        "精度: " + accuracy + "m";

    },
    function(error) {

      let msg = "";

      switch(error.code) {
        case error.PERMISSION_DENIED:
          msg = "位置情報の利用が拒否されました";
          break;
        case error.POSITION_UNAVAILABLE:
          msg = "位置情報を取得できません";
          break;
        case error.TIMEOUT:
          msg = "位置情報取得がタイムアウトしました";
          break;
        default:
          msg = "不明なエラー";
      }

      result.textContent = msg;

    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}
</script>
